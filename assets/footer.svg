      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".25" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset=".75" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 21H960" stroke="url(#g)" stroke-width="2" stroke-dasharray="16 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <circle cx="480" cy="21" r="5" fill="#E0F2FE">
